[source.crates-io]
# Use the fast sparse HTTP index instead of the legacy full-git-repo index.
# The git index made cargo hang on "Updating crates.io index" by git-fetching
# the entire crates.io-index repo; the sparse index fetches only needed
# crate metadata over HTTP.
registry = "sparse+https://index.crates.io/"
# replace-with = 'tuna'

[source.tuna]
registry = "https://mirrors.tuna.tsinghua.edu.cn/git/crates.io-index.git"

[source.ustc]
registry = "git://mirrors.ustc.edu.cn/crates.io-index"

[net]
git-fetch-with-cli = true

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=/sbin/mold"]
